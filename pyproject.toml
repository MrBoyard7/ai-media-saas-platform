[project]
name = "ai-media-saas-platform"
version = "1.0.0"
description = "Enterprise-grade, multi-tenant, white-label AI SaaS platform for lyrics, music, voice and video generation."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Prince Boyard MBOUNGOU NGOMA" }]

[tool.black]
line-length = 110
target-version = ["py39", "py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 110
known_first_party = ["app"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "B008",   # FastAPI's Depends(...) in function defaults is intentional
]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy's Mapped[] annotation resolver is a separate mechanism from
# Pydantic's (unaffected by eval_type_backport) and, confirmed via a real
# CI failure on Python 3.9, cannot evaluate either a quoted forward
# reference stripped of its quotes (UP037) or PEP 604 'X | None' syntax
# (UP007) -- it needs Optional[X] and, for cross-file relationships,
# actual quoted strings ("Wallet") resolved through its own mapper
# registry. Scoped to app/models/ only so these rules stay active (and
# useful) everywhere else in the codebase.
"app/models/*.py" = ["UP037", "UP007"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
exclude = ["tests/", "migrations/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "*/tests/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
fail_under = 80